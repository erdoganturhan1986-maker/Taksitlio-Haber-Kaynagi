name: Haber guncelleme

on:
  schedule:
    - cron: "40 4-20 * * *"   # her gün 07:40 - 23:40 arası saat başı (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: haber-guncelleme
  cancel-in-progress: false

jobs:
  haberler:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser googlenewsdecoder "selectolax<1.0"
      - name: Haberleri topla, dogrula ve yorumlat
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python haberler.py
      - name: Kaydet
        run: |
          git config user.name "haber-botu"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/haberler.json data/haber_onbellek.json
          git commit -m "Haberler guncellendi" || exit 0
          git pull --rebase
          git push
