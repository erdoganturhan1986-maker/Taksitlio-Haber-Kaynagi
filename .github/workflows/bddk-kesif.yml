name: BDDK kesif

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: BDDK sayfalarini indir
        run: |
          python - << 'PYEOF'
          import os, re, urllib.parse, urllib.request
          KLASOR = "data/bddk_kesif"
          os.makedirs(KLASOR, exist_ok=True)
          BASLIK = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}

          def al(url):
              try:
                  istek = urllib.request.Request(url, headers=BASLIK)
                  with urllib.request.urlopen(istek, timeout=60) as r:
                      return str(r.status), r.geturl(), r.read().decode("utf-8", "replace")
              except Exception as hata:
                  return "HATA", url, str(hata)

          SAYFALAR = [
              "https://www.bddk.org.tr/BultenHaftalik",
              "https://www.bddk.org.tr/BultenHaftalik/tr/Home/Gelismis",
              "https://www.bddk.org.tr/BultenAylik",
              "https://www.bddk.org.tr/BultenAylik/tr/Home/Gelismis",
              "https://www.bddk.org.tr/BultenAylik/tr/Home/BasitRapor",
          ]
          ozet, gorulen = [], set()
          for i, url in enumerate(SAYFALAR):
              durum, son_url, icerik = al(url)
              ad = f"sayfa{i}.html"
              open(f"{KLASOR}/{ad}", "w").write(icerik)
              ozet.append(f"{url} -> {durum} -> {son_url} | {len(icerik)} karakter | {ad}")
              for js in re.findall(r'src="([^"]+\.js[^"]*)"', icerik):
                  tam = urllib.parse.urljoin(son_url, js)
                  if tam in gorulen or len(gorulen) >= 20:
                      continue
                  if any(k in tam.lower() for k in ["jquery", "bootstrap", "google", "cdn"]):
                      continue
                  gorulen.add(tam)
                  d2, _, js_icerik = al(tam)
                  ad2 = f"js{len(gorulen)}.js"
                  open(f"{KLASOR}/{ad2}", "w").write(js_icerik)
                  ozet.append(f"   JS {tam} -> {d2} | {len(js_icerik)} karakter | {ad2}")
          open(f"{KLASOR}/ozet.txt", "w").write("\n".join(ozet))
          print("\n".join(ozet))
          PYEOF
      - name: Sonuclari kaydet
        run: |
          git config user.name "haber-botu"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bddk_kesif
          git commit -m "BDDK kesif sonuclari" || exit 0
          git pull --rebase
          git push
