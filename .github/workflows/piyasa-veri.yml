name: Piyasa verisi

on:
  schedule:
    - cron: "5 6-16 * * 1-5"   # iş günleri 09:05-19:05 arası saat başı (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  piyasa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas yfinance
      - name: Piyasa verisini cek
        run: python piyasa.py
      - name: Kaydet
        run: |
          git config user.name "haber-botu"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Piyasa verisi guncellendi" || exit 0
          git pull --rebase
          git push
