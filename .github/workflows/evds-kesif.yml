name: EVDS kesif

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: EVDS katalogunu tara
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          python - << 'PYEOF'
          import os, re, ssl, urllib.error, urllib.request
          KLASOR = "data/evds_kesif"
          os.makedirs(KLASOR, exist_ok=True)
          ANAHTAR = os.environ.get("EVDS_API_KEY", "").strip()
          SITE = "https://evds3.tcmb.gov.tr"
          ESNEK = ssl.create_default_context()
          ESNEK.check_hostname = False
          ESNEK.verify_mode = ssl.CERT_NONE

          def al(url, anahtarli=False):
              basliklar = {"User-Agent": "Mozilla/5.0"}
              if anahtarli:
                  basliklar["key"] = ANAHTAR
              istek = urllib.request.Request(url, headers=basliklar)
              for baglam in (None, ESNEK):
                  try:
                      with urllib.request.urlopen(istek, timeout=60, context=baglam) as r:
                          return f"HTTP {r.status} | {r.headers.get('Content-Type')} | {r.geturl()}", r.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as hata:
                      return f"HTTP {hata.code} | {hata.headers.get('Content-Type')}", hata.read().decode("utf-8", "replace")
                  except Exception as hata:
                      son = f"BAĞLANTI HATASI: {str(hata)[:200]}"
              return son, ""

          ozet = []
          # 1) JavaScript dosyalarındaki adresleri ayıkla
          _, sayfa = al(SITE + "/")
          dosyalar = set(re.findall(r'/assets/[\w\-./]+\.js', sayfa))
          incelenen, bulunan = set(), set()
          while dosyalar and len(incelenen) < 60:
              yol = dosyalar.pop()
              if yol in incelenen or "vendor" in yol:
                  incelenen.add(yol)
                  continue
              incelenen.add(yol)
              _, js = al(SITE + yol)
              dosyalar |= {("/assets/" + x.split("assets/")[-1]) for x in re.findall(r'["\'`(]\.{0,2}/?(?:assets/)?([\w\-]+\.js)', js)}
              for m in re.findall(r'["\'`]([^"\'`\s]{0,80}(?:service|igm|/api/|evds|serie|datagroup|categor|baseURL|baseUrl)[^"\'`\s]{0,80})["\'`]', js):
                  bulunan.add(m)
          ozet.append(f"İncelenen JS dosyası: {len(incelenen)}")
          ozet.append("Bulunan adres benzeri metinler:")
          ozet += [f"   {b}" for b in sorted(bulunan)][:300]

          # 2) Olası veri adreslerini anahtarla dene
          seri = "series=TP.DK.USD.A&startDate=01-09-2026&endDate=30-09-2026&type=json"
          for aday in [
              f"{SITE}/igmevdsms-dis/{seri}",
              f"{SITE}/service/evds/{seri}",
              f"{SITE}/api/{seri}",
              f"{SITE}/igmevdsms-dis/categories/type=json",
              f"{SITE}/service/evds/categories/type=json",
          ]:
              durum, govde = al(aday, anahtarli=True)
              govde = govde.replace(ANAHTAR, "***") if ANAHTAR else govde
              ozet.append(f"\nDENEME {aday}\n    {durum} | {len(govde)} karakter\n    başı: {govde[:400]!r}")
          open(f"{KLASOR}/ozet.txt", "w").write("\n".join(ozet))
          print("\n".join(ozet[-30:]))
          PYEOF
      - name: Sonuclari kaydet
        run: |
          git config user.name "haber-botu"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/evds_kesif
          git commit -m "EVDS kesif sonuclari" || exit 0
          git pull --rebase
          git push
