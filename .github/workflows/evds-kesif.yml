name: EVDS kesif

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: EVDS adreslerini dene
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          python - << 'PYEOF'
          import os, ssl, urllib.error, urllib.request
          KLASOR = "data/evds_kesif"
          os.makedirs(KLASOR, exist_ok=True)
          ANAHTAR = os.environ.get("EVDS_API_KEY", "").strip()
          ESNEK = ssl.create_default_context()
          ESNEK.check_hostname = False
          ESNEK.verify_mode = ssl.CERT_NONE
          DENEMELER = [
              "https://evds2.tcmb.gov.tr/service/evds/categories/type=json",
              "https://evds2.tcmb.gov.tr/service/evds/datagroups/mode=0&type=json",
              "https://evds2.tcmb.gov.tr/service/evds/series=TP.DK.USD.A&startDate=01-09-2026&endDate=30-09-2026&type=json",
              "https://evds2.tcmb.gov.tr/",
              "https://evds3.tcmb.gov.tr/",
          ]
          ozet = [f"Anahtar uzunluğu: {len(ANAHTAR)}"]
          for i, url in enumerate(DENEMELER):
              istek = urllib.request.Request(url, headers={"key": ANAHTAR, "User-Agent": "Mozilla/5.0"})
              sonuc = ""
              for baglam in (None, ESNEK):
                  try:
                      with urllib.request.urlopen(istek, timeout=60, context=baglam) as r:
                          govde = r.read().decode("utf-8", "replace")
                          sonuc = f"HTTP {r.status} | {r.headers.get('Content-Type')} | son adres: {r.geturl()}"
                      break
                  except urllib.error.HTTPError as hata:
                      govde = hata.read().decode("utf-8", "replace")
                      sonuc = f"HTTP {hata.code} | {hata.headers.get('Content-Type')}"
                      break
                  except Exception as hata:
                      govde, sonuc = "", f"BAĞLANTI HATASI: {str(hata)[:200]}"
              govde = govde.replace(ANAHTAR, "***") if ANAHTAR else govde
              open(f"{KLASOR}/deneme{i}.txt", "w").write(govde[:20000])
              ozet.append(f"\n[{i}] {url}\n    {sonuc} | {len(govde)} karakter\n    başı: {govde[:300]!r}")
          open(f"{KLASOR}/ozet.txt", "w").write("\n".join(ozet))
          print("\n".join(ozet))
          PYEOF
      - name: Sonuclari kaydet
        run: |
          git config user.name "haber-botu"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/evds_kesif
          git commit -m "EVDS kesif sonuclari" || exit 0
          git pull --rebase
          git push
