name: Tuketici guven verisi

on:
  schedule:
    - cron: "50 6 * * *"   # her gün 09:50 (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Tuketici guven verisini cek
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python guven.py
      - name: Kaydet
        run: |
          git config user.name "haber-botu"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Tuketici guven verisi guncellendi" || exit 0
          git pull --rebase
          git push
