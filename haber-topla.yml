name: Haberleri topla

on:
  schedule:
    - cron: "0 * * * *"   # her saat başı
  workflow_dispatch:       # elle çalıştırma butonu

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Haberleri topla
        run: python collector.py
      - name: AI agent ile rakamları çıkar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent.py
      - name: Yeni verileri kaydet
        run: |
          git config user.name "haber-botu"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Veriler güncellendi" && git push)
